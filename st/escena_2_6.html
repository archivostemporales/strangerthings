<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T2-E6: El portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=EB+Garamond:wght@800&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --vecna-red: #b30000;
            --vecna-glow: #ff0000;
            --bone-white: #e0d8c3;
            --dark-bg: #050505;
            --panel-bg: rgba(20, 0, 0, 0.9);
            --typewriter: 'Special Elite', serif;
            --gothic: 'EB Garamond', serif;
            --gold: #ffd700;
        }

        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(179, 0, 0, 0.05), rgba(0, 0, 0, 0.05));
            z-index: 9999; background-size: 100% 2px, 2px 100%; pointer-events: none;
        }

        body {
            background-color: var(--dark-bg); color: var(--bone-white);
            font-family: var(--typewriter); margin: 0; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        header {
            text-align: center; border-bottom: 3px solid var(--vecna-red);
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 5px 20px var(--vecna-red);
            background: #000;
        }

        header h1 {
            margin: 0; font-family: var(--gothic);
            color: var(--vecna-red); font-size: 2rem; letter-spacing: 4px;
            text-shadow: 0 0 15px var(--vecna-glow);
        }

        .main-wrapper {
            display: grid; grid-template-columns: 220px 1fr 240px;
            gap: 20px; flex-grow: 1;
        }

        .side-panel {
            background: var(--panel-bg); border: 1px solid var(--vecna-red);
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }

        .char-box { display: flex; flex-direction: column; align-items: center; border: 1px solid #411; padding: 8px; background: rgba(0,0,0,0.6); }
        .char-link { display: block; width: 80px; height: 100px; border: 1px solid var(--vecna-red); overflow: hidden; transition: 0.3s; cursor: pointer; }
        .char-link:hover { border-color: var(--gold); transform: scale(1.05); box-shadow: 0 0 10px var(--gold); }
        .char-img { width: 100%; height: 100%; object-fit: cover; }
        .char-name { font-size: 0.65rem; color: var(--vecna-red); margin-top: 5px; font-weight: bold; text-align: center; }

        .btn {
            background: #1a0000; color: var(--bone-white); border: 1px solid var(--vecna-red);
            padding: 12px; font-family: var(--gothic); cursor: pointer;
            font-size: 0.85rem; width: 100%; text-align: left; text-transform: uppercase;
            font-weight: bold; margin-bottom: 8px; transition: 0.2s;
        }
        .btn:hover:not(:disabled) { background: var(--vecna-red); color: white; box-shadow: 0 0 10px var(--vecna-glow); }

        .scene-frame { width: 100%; height: 40vh; object-fit: cover; border: 2px solid var(--vecna-red); margin-bottom: 15px; }
        
        .narrative-text {
            background: rgba(0,0,0,0.95); border-left: 5px solid var(--vecna-red);
            padding: 25px; color: var(--bone-white); font-size: 1.1rem; line-height: 1.6; flex-grow: 1;
        }

        .dice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dice-btn {
            background: #000; border: 1px solid var(--vecna-red);
            color: var(--vecna-red); font-family: 'Bangers', cursive;
            font-size: 1.4rem; padding: 8px; cursor: pointer;
        }
        .dice-btn:hover { background: var(--vecna-red); color: #000; }
        
        .result-window {
            margin: 10px 0; background: #000; border: 2px double var(--vecna-red);
            height: 70px; display: flex; align-items: center; justify-content: center;
font-family: 'Courier New', Courier, monospace;
font-size: 3.5rem; /* Subimos un poco el tamaño para que se vea mejor */
color: var(--vecna-red);
text-shadow: 0 0 15px var(--vecna-red);
            text-shadow: 0 0 15px var(--vecna-red);
        }

        #explode-msg { text-align:center; color: var(--gold); font-family:'Bangers'; visibility:hidden; font-size: 1.2rem; }

        .check-ui { display: flex; gap: 10px; margin-top: 15px; }
        .btn-ok { border-color: #00ff00; color: #00ff00; text-align: center; flex: 1; }
        .btn-fail { border-color: var(--vecna-red); color: var(--vecna-red); text-align: center; flex: 1; }

        .card-display {
            border: 2px solid var(--gold); padding: 15px; margin-top: 15px;
            background: rgba(255, 215, 0, 0.05); color: var(--gold); display: none;
            text-align: center; font-weight: bold;
        }

/* --- NUEVOS ESTILOS PARA LA PANTALLA DE INICIO --- */
#splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #200000 0%, #050505 100%);
    display: flex; justify-content: center; align-items: center;
    z-index: 10000; overflow: hidden;
}

.btn-inicio-central {
    background: rgba(0,0,0,0.6); color: #b30000; border: 4px solid #b30000;
    padding: 30px 60px; font-family: 'EB Garamond', serif; font-size: 3rem;
    letter-spacing: 10px; cursor: pointer; text-shadow: 0 0 15px #ff0000;
    box-shadow: 0 0 30px rgba(179, 0, 0, 0.6);
    animation: flicker 3s infinite;
}

@keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.3; text-shadow: none; }
}

    </style>
</head>
<body>
<div id="splash-screen" onclick="comenzarTodo()">
    <button class="btn-inicio-central">INICIAR</button>
</div>

    <audio id="audioMusic" src="audio/action.mp3" loop></audio>
    <audio id="audioDice" src="audio/dados.mp3"></audio>
    <audio id="audioClick" src="audio/clic.mp3"></audio>
    <audio id="audioThunder" src="audio/thunder.mp3"></audio>
    <audio id="audioExplosion" src="audio/explosion.mp3"></audio>

    <header><h1>T2 - E6: EL PORTAL</h1></header>
     <div class="main-wrapper">
<aside class="side-panel" id="banner-personajes">
 
            <div class="char-box"><a href="fichas/once2.jpg" target="_blank" class="char-link"><img src="images/once2.jpg" class="char-img"></a><span class="char-name">ONCE</span></div>
            <div class="char-box"><a href="fichas/mike2.jpg" target="_blank" class="char-link"><img src="images/mike2.jpg" class="char-img"></a><span class="char-name">MIKE</span></div>
            <div class="char-box"><a href="fichas/will2.jpg" target="_blank" class="char-link"><img src="images/will2.jpg" class="char-img"></a><span class="char-name">WILL</span></div>
            <div class="char-box"><a href="fichas/dustin2.jpg" target="_blank" class="char-link"><img src="images/dustin2.jpg" class="char-img"></a><span class="char-name">DUSTIN</span></div>
            <div class="char-box"><a href="fichas/lucas2.jpg" target="_blank" class="char-link"><img src="images/lucas2.jpg" class="char-img"></a><span class="char-name">LUCAS</span></div>
            <div class="char-box"><a href="fichas/max2.jpg" target="_blank" class="char-link"><img src="images/max2.jpg" class="char-img"></a><span class="char-name">MAX</span></div>
            <div class="char-box"><a href="fichas/jonathan2.jpg" target="_blank" class="char-link"><img src="images/jonathan2.jpg" class="char-img"></a><span class="char-name">JONATHAN</span></div>
            <div class="char-box"><a href="fichas/nancy2.jpg" target="_blank" class="char-link"><img src="images/nancy2.jpg" class="char-img"></a><span class="char-name">NANCY</span></div>
            <div class="char-box"><a href="fichas/steve2.jpg" target="_blank" class="char-link"><img src="images/steve2.jpg" class="char-img"></a><span class="char-name">STEVE</span></div>
            <div class="char-box"><a href="fichas/hopper2.jpg" target="_blank" class="char-link"><img src="images/hopper2.jpg" class="char-img"></a><span class="char-name">HOPPER</span></div>
            <div class="char-box"><a href="fichas/joyce2.jpg" target="_blank" class="char-link"><img src="images/joyce2.jpg" class="char-img"></a><span class="char-name">JOYCE</span></div>
            <div class="char-box"><a href="fichas/bob2.jpg" target="_blank" class="char-link"><img src="images/bob2.jpg" class="char-img"></a><span class="char-name">BOB</span></div>



        </aside>

        <main style="display: flex; flex-direction: column;">
		<img id="scene-img" src="images/261.jpg" class="scene-frame">
            <div class="narrative-text">
                <div id="text-content">




	                   El destino de Hawkins se decide ahora. Once se enfrenta a la brecha gigante, mientras en una cabaña aislada, Joyce se prepara para sacar al virus fuera del cuerpo de Will.
 



                </div>
                <div id="options-container">
                    <button class="btn" style="text-align:center" onclick="renderStep()">COMENZAR CAPÍTULO</button>
                </div>
                <div id="final-card" class="card-display"></div>
            </div>
        </main>

        <aside class="side-panel">
            <label style="font-size: 0.6rem; color: var(--vecna-red); text-align: center;">DADOS</label>
            <div class="dice-grid">
                <button class="dice-btn" onclick="roll(4)">d4</button>
                <button class="dice-btn" onclick="roll(6)">d6</button>
                <button class="dice-btn" onclick="roll(8)">d8</button>
                <button class="dice-btn" onclick="roll(10)">d10</button>
                <button class="dice-btn" onclick="roll(12)">d12</button>
                <button class="dice-btn" onclick="roll(20)">d20</button>
            </div>
            <div class="result-window" id="result">--</div>
            <div id="explode-msg">¡EXPLOTA!</div>
            <div style="margin-top: auto;">





           <div style="margin-top: auto;">
                <button class="btn" id="ctrl-voice" onclick="toggleVoice(event)">🎙️ VOZ: <span id="status-voice">ON</span></button>
                <button class="btn" id="ctrl-music" onclick="toggleMusic(event)">📻 MÚSICA: <span id="status-music">ON</span></button>
            </div>


                <button class="btn" style="border-color: #555; text-align: center;" onclick="goBack()">🏠 MENÚ</button>
            </div>
        </aside>
    </div>

    <script>
        let step = 0;
        let successes = 0;
        let failures = 0;
        let voiceEnabled = true;
        let musicEnabled = true;
        let started = false;

        const trama = [

// *********************************************************** ACTOS ************************************************************************************

            {
                text: "ACTO 1: El exorcismo. Joyce sube la temperatura de la cabaña al máximo. Will grita con una voz que no es la suya.",
        img: "images/261.jpg",
participantes: ["joyce2.jpg", "will2.jpg"],
                options: [
                    { label: "Joyce: Sujetar a Will contra las estufas", attr: "Agallas", dif: 8 },
                    { label: "Joyce: Hablarle al verdadero Will (Recuerdos)", attr: "Encanto", dif: 8 }
                ],
                win: "Will lucha desde dentro. El calor empieza a debilitar el control del Azotamentes.",
                lose: "Will rompe sus ataduras y ataca a Joyce. La sombra se hace más fuerte. (+1 Adversidad)"
            },
            {
                text: "ACTO 2: El ascenso de Once. Hopper y Once bajan por la plataforma hacia el núcleo del portal.",
        img: "images/262.jpg",
participantes: ["once2.jpg", "hopper2.jpg"],
                options: [
                    { label: "Once: Canalizar la ira de los traumas pasados", attr: "Agallas", dif: 8 },
                    { label: "Hopper: Proteger a Once de los Demoperros", attr: "Pelea", dif: 8 }
                ],
                win: "Hopper mantiene a raya a las criaturas mientras Once empieza a levitar, sus ojos inyectados en sangre.",
                lose: "Los Demoperros dañan la plataforma. Once pierde la concentración. (+1 Adversidad)"
            },
            {
                text: "ACTO 3: El grito de la sombra. El virus intenta salir de Will con la forma de una nube de partículas negras.",
        img: "images/263.gif",
participantes: ["joyce2.jpg", "will2.jpg"],
                options: [
                    { label: "No soltar a Will a pesar de las quemaduras", attr: "Músculo", dif: 8 },
                    { label: "Usar un atizador ardiendo para expulsarlo", attr: "Pelea", dif: 8 }
                ],
                win: "La sombra sale disparada por la ventana, huyendo hacia el cielo nocturno. ¡Will es libre!",
                lose: "La sombra se refugia en Will más profundamente. El niño entra en shock (+1 Adversidad)"
            },
            {
                text: "ACTO 4: La Brecha Final. El Azotamentes extiende un tentáculo gigante desde el portal hacia Once.",
        img: "images/264.gif",
participantes: ["once2.jpg", "hopper2.jpg"],
                options: [
                    { label: "Once: Mantener el control mental total", attr: "Cerebro", dif: 8 },
                    { label: "Once: Gritar con todo el poder psíquico", attr: "Agallas", dif: 8 }
                ],
                win: "Once repele el tentáculo, empujando la brecha hacia dentro con una fuerza descomunal.",
                lose: "Once cae de rodillas, agotada. El portal empieza a expandirse. (+1 Adversidad)"
            },
            {
                text: "ACTO 5: La Huida de los Chicos. Steve y los niños corren por los túneles mientras estos colapsan.",
        img: "images/265.gif",
participantes: ["max2.jpg", "mike2.jpg", "dustin2.jpg", "lucas2.jpg", "steve2.jpg"],
                options: [
                    { label: "Guiar a través del laberinto", attr: "Evasión", dif: 8 },
                    { label: "Usar el mapa para encontrar la salida", attr: "Cerebro", dif: 8 }
                ],
                win: "Lográis salir segundos antes de que la tierra trague los túneles por completo.",
                lose: "Quedáis atrapados bajo los escombros momentáneamente, pero lográis salir con dificultad. (+1 Adversidad)"
            },
            {
                text: "ACTO 6: 'Ciérralo'. Once levita en el centro de un torbellino de energía. Es el último esfuerzo.",
        img: "images/266.gif",
participantes: ["once2.jpg", "hopper2.jpg"],
                options: [
                    { label: "Once: Cerrar el portal definitivamente", attr: "Agallas", dif: 14 },
                    { label: "Once: Sacrificio de energía total", attr: "Cerebro", dif: 14 }
                ],
                win: "¡Bum! El portal se sella con un estallido de luz. Once cae en brazos de Hopper. Se acabó.",
                lose: "El portal se cierra, pero Once cae inconsciente. (+1 Adversidad)"
            }

// **********************************************************************************************************************************************
        ];

function comenzarTodo() {
    document.getElementById('splash-screen').style.display = 'none';
    started = true;
    document.getElementById('audioMusic').play().catch(() => {}); 
    speak(document.getElementById('text-content').innerText); 
}

function renderStep() {
    if(step >= trama.length) { showEnding(); return; }
    const data = trama[step];

    // --- LÓGICA DEL TELÉFONO (NUEVO) ---
    // El Acto 6 es la posición 5 (porque empezamos a contar desde 0)
    if (step === 1) { 
        const tlf = document.getElementById('audioTelefono');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 3) { 
        const tlf = document.getElementById('audioThunder');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 5) { 
        const tlf = document.getElementById('audioExplosion');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    
    document.getElementById('scene-img').src = data.img;
    document.getElementById('text-content').innerText = data.text;

    // Actualizar Banner dinámico
    const banner = document.getElementById('banner-personajes');
    if (banner) {
        banner.innerHTML = ""; 
        if (data.participantes) {
            data.participantes.forEach(foto => {
                const nombreBase = foto.split('.')[0].replace(/[0-9]/g, ''); 
                const numTemp = foto.replace(/[^0-9]/g, ''); 
                banner.innerHTML += `
                    <div class="char-box">
                        <a href="fichas/${nombreBase}${numTemp}.jpg" target="_blank" class="char-link">
                            <img src="images/${foto}" class="char-img">
                        </a>
                        <span class="char-name">${nombreBase.toUpperCase()}</span>
                    </div>`;
            });
        }
    }

    const container = document.getElementById('options-container');
    container.innerHTML = "";
    data.options.forEach(o => {
        const b = document.createElement('button');
        b.className = "btn";
        b.innerHTML = `${o.label} <span style="color:var(--gold)">(${o.attr} Dif. ${o.dif})</span>`;
        b.onclick = () => askCheck(o.attr, o.dif);
        container.appendChild(b);
    });
    speak(data.text);
}

function askCheck(attr, dif) {
    const container = document.getElementById('options-container');
    container.innerHTML = `
        <div style="text-align:center; padding: 10px; border: 1px dashed var(--vecna-red); background: rgba(20,0,0,0.5);">
            <p>Tirada de: <strong>${attr}</strong> | Dificultad: <strong>${dif}</strong></p>
        </div>
        <div class="check-ui">
            <button class="btn btn-ok" onclick="resolve(true)">ÉXITO</button>
            <button class="btn btn-fail" onclick="resolve(false)">FALLO</button>
        </div>`;
}

function resolve(win) {
    const data = trama[step];
    if(win) successes++; else failures++;
    document.getElementById('text-content').innerHTML = `<span style="color:${win?'#00ff00':'var(--vecna-red)'}">${win ? data.win : data.lose}</span>`;
    
    // BOTÓN QUE ARREGLA EL ERROR:
    document.getElementById('options-container').innerHTML = `
        <button class="btn" style="text-align:center" onclick="avanzarActo()">
            ${step === (trama.length - 1) ? 'VER EPÍLOGO' : 'SIGUIENTE ACTO'}
        </button>`;
    speak(win ? data.win : data.lose);
}

function avanzarActo() {
    step++;
    renderStep();
}






// ******************************************* FINALES **************************************************************************

function showEnding() {
    const card = document.getElementById('final-card');
    const sceneImg = document.getElementById('scene-img'); // Referencia a la imagen
    card.style.display = "block";
    let title = "", desc = "";
    
    // Condición 1: Final Bueno (4 o más éxitos)
    if(successes >= 5) {
        sceneImg.src = "images/266b.gif"; 
        title = "FINAL PERFECTO: EL BAILE DE INVIERNO";
        desc = "Hawkins está a salvo. Will es libre, Once tiene su libertad legal y el portal está sellado. El baile de invierno es un momento de paz. Por ahora. Ganáis una recompensa. [Código Temporada 3: 3333]";
    } 
    // Condición 2: Final Normal (Exactamente 3 éxitos y 3 fallos)
    else if(successes === 3 || successes === 4) {
        sceneImg.src = "images/266b.gif";
        title = "FINAL NORMAL: CICATRICES DE HAWKINS";
        desc = "Habéis ganado, pero Hawkins nunca será igual. Bob ha muerto, el laboratorio está en ruinas y todos lleváis el trauma de la sombra en vuestros corazones. El baile de invierno es un momento de paz. Por ahora. [Código Temporada 3: 3333]";
    } 
    // Condición 3: Final Malo (Menos de 3 éxitos)
    else {
        sceneImg.src = "images/gameover.gif";
        title = "FINAL OSCURO: LA SOMBRA ACECHA";
        desc = "El portal se cerró, pero Will sigue sintiendo el frío. Once está exhausta y el Azotamentes observa desde el Mundo del Revés, esperando su momento. Debéis repetir el capítulo.";
    }

    document.getElementById('text-content').innerHTML = `<strong>${title}</strong><br>Éxitos: ${successes} | Fallos: ${failures}`;
    card.innerText = desc;
    
    // Lógica de botones
    let canProgress = (successes >= 4) || (successes === 3 && failures === 3);
    if(canProgress) {
        document.getElementById('options-container').innerHTML = `
            <button class="btn" style="text-align:center; border-color:var(--gold); color:var(--gold);" onclick="window.location.href='menu.html'">⏭️ VOLVER AL MENÚ PRINCIPAL</button>
        `;
    } else {
        document.getElementById('options-container').innerHTML = `
            <button class="btn" style="text-align:center; border-color:var(--vecna-red);" onclick="location.reload()">🔄 REINTENTAR CAPÍTULO</button>
        `;
    }
    speak(title + ". " + desc);
}

// **********************************************************************************************************************************************

        function roll(sides) {
            const sfx = document.getElementById('audioDice'); sfx.currentTime = 0; sfx.play();
            const res = Math.floor(Math.random() * sides) + 1;
            document.getElementById('result').innerText = res;
            document.getElementById('explode-msg').style.visibility = (res === sides) ? "visible" : "hidden";
        }

        function toggleMusic(e) { 
            e.stopPropagation(); musicEnabled = !musicEnabled; 
            const m = document.getElementById('audioMusic'); 
            musicEnabled ? m.play() : m.pause(); 
            document.getElementById('status-music').innerText = musicEnabled ? "ON" : "OFF"; 
        }

        function toggleVoice(e) { 
            e.stopPropagation(); voiceEnabled = !voiceEnabled; 
            document.getElementById('status-voice').innerText = voiceEnabled ? "ON" : "OFF"; 
            if(!voiceEnabled) window.speechSynthesis.cancel(); 
        }

        function speak(t) { 
            if(!voiceEnabled) return; 
            window.speechSynthesis.cancel(); 
            const m = new SpeechSynthesisUtterance(t); 
            m.lang = 'es-ES'; m.rate = 1.0;
            window.speechSynthesis.speak(m); 
        }

        function goBack() { if(confirm("¿Volver al menú?")) window.location.href = "menu.html"; }


function playClick() {
    const clickSfx = document.getElementById('audioClick');
    if (clickSfx) {
        clickSfx.currentTime = 0; // Reinicia el sonido para que suene en cada clic rápido
        clickSfx.play().catch(() => {}); // El catch evita errores si el navegador bloquea el audio
    }
}
document.addEventListener('click', playClick);
    </script>
</body>
</html>
