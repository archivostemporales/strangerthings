<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T3-E6: La batalla de Starcourt</title>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=EB+Garamond:wght@800&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --vecna-red: #b30000;
            --vecna-glow: #ff0000;
            --bone-white: #e0d8c3;
            --dark-bg: #050505;
            --panel-bg: rgba(20, 0, 0, 0.9);
            --typewriter: 'Special Elite', serif;
            --gothic: 'EB Garamond', serif;
            --gold: #ffd700;
        }

        body::before {
            content: " "; display: block; position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.3) 50%), 
                        linear-gradient(90deg, rgba(179, 0, 0, 0.05), rgba(0, 0, 0, 0.05));
            z-index: 9999; background-size: 100% 2px, 2px 100%; pointer-events: none;
        }

        body {
            background-color: var(--dark-bg); color: var(--bone-white);
            font-family: var(--typewriter); margin: 0; padding: 20px;
            min-height: 100vh; display: flex; flex-direction: column;
        }

        header {
            text-align: center; border-bottom: 3px solid var(--vecna-red);
            padding: 15px; margin-bottom: 20px;
            box-shadow: 0 5px 20px var(--vecna-red);
            background: #000;
        }

        header h1 {
            margin: 0; font-family: var(--gothic);
            color: var(--vecna-red); font-size: 2rem; letter-spacing: 4px;
            text-shadow: 0 0 15px var(--vecna-glow);
        }

        .main-wrapper {
            display: grid; grid-template-columns: 220px 1fr 240px;
            gap: 20px; flex-grow: 1;
        }

        .side-panel {
            background: var(--panel-bg); border: 1px solid var(--vecna-red);
            padding: 15px; display: flex; flex-direction: column; gap: 15px;
        }

        .char-box { display: flex; flex-direction: column; align-items: center; border: 1px solid #411; padding: 8px; background: rgba(0,0,0,0.6); }
        .char-link { display: block; width: 80px; height: 100px; border: 1px solid var(--vecna-red); overflow: hidden; transition: 0.3s; cursor: pointer; }
        .char-link:hover { border-color: var(--gold); transform: scale(1.05); box-shadow: 0 0 10px var(--gold); }
        .char-img { width: 100%; height: 100%; object-fit: cover; }
        .char-name { font-size: 0.65rem; color: var(--vecna-red); margin-top: 5px; font-weight: bold; text-align: center; }

        .btn {
            background: #1a0000; color: var(--bone-white); border: 1px solid var(--vecna-red);
            padding: 12px; font-family: var(--gothic); cursor: pointer;
            font-size: 0.85rem; width: 100%; text-align: left; text-transform: uppercase;
            font-weight: bold; margin-bottom: 8px; transition: 0.2s;
        }
        .btn:hover:not(:disabled) { background: var(--vecna-red); color: white; box-shadow: 0 0 10px var(--vecna-glow); }

        .scene-frame { width: 100%; height: 40vh; object-fit: cover; border: 2px solid var(--vecna-red); margin-bottom: 15px; }
        
        .narrative-text {
            background: rgba(0,0,0,0.95); border-left: 5px solid var(--vecna-red);
            padding: 25px; color: var(--bone-white); font-size: 1.1rem; line-height: 1.6; flex-grow: 1;
        }

        .dice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .dice-btn {
            background: #000; border: 1px solid var(--vecna-red);
            color: var(--vecna-red); font-family: 'Bangers', cursive;
            font-size: 1.4rem; padding: 8px; cursor: pointer;
        }
        .dice-btn:hover { background: var(--vecna-red); color: #000; }
        
        .result-window {
            margin: 10px 0; background: #000; border: 2px double var(--vecna-red);
            height: 70px; display: flex; align-items: center; justify-content: center;
font-family: 'Courier New', Courier, monospace;
font-size: 3.5rem; /* Subimos un poco el tamaño para que se vea mejor */
color: var(--vecna-red);
text-shadow: 0 0 15px var(--vecna-red);
            text-shadow: 0 0 15px var(--vecna-red);
        }

        #explode-msg { text-align:center; color: var(--gold); font-family:'Bangers'; visibility:hidden; font-size: 1.2rem; }

        .check-ui { display: flex; gap: 10px; margin-top: 15px; }
        .btn-ok { border-color: #00ff00; color: #00ff00; text-align: center; flex: 1; }
        .btn-fail { border-color: var(--vecna-red); color: var(--vecna-red); text-align: center; flex: 1; }

        .card-display {
            border: 2px solid var(--gold); padding: 15px; margin-top: 15px;
            background: rgba(255, 215, 0, 0.05); color: var(--gold); display: none;
            text-align: center; font-weight: bold;
        }

/* --- NUEVOS ESTILOS PARA LA PANTALLA DE INICIO --- */
#splash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle, #200000 0%, #050505 100%);
    display: flex; justify-content: center; align-items: center;
    z-index: 10000; overflow: hidden;
}

.btn-inicio-central {
    background: rgba(0,0,0,0.6); color: #b30000; border: 4px solid #b30000;
    padding: 30px 60px; font-family: 'EB Garamond', serif; font-size: 3rem;
    letter-spacing: 10px; cursor: pointer; text-shadow: 0 0 15px #ff0000;
    box-shadow: 0 0 30px rgba(179, 0, 0, 0.6);
    animation: flicker 3s infinite;
}

@keyframes flicker {
    0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
    20%, 24%, 55% { opacity: 0.3; text-shadow: none; }
}

    </style>
</head>
<body>
<div id="splash-screen" onclick="comenzarTodo()">
    <button class="btn-inicio-central">INICIAR</button>
</div>

    <audio id="audioMusic" src="audio/action.mp3" loop></audio>
    <audio id="audioClick" src="audio/clic.mp3"></audio>
    <audio id="audioDice" src="audio/dados.mp3"></audio>
    <audio id="audioReactor" src="audio/reactor.mp3"></audio>
    <audio id="audioDemogorgon" src="audio/demogorgon_roar.mp3"></audio>
    <audio id="audioGun" src="audio/gun.mp3"></audio>

    <header><h1>T3 - E6: LA BATALLA DE STARCOURT</h1></header>
     <div class="main-wrapper">
<aside class="side-panel" id="banner-personajes">
 

            <div class="char-box"><a href="fichas/once3.jpg" target="_blank" class="char-link"><img src="images/once3.jpg" class="char-img"></a><span class="char-name">ONCE</span></div>
            <div class="char-box"><a href="fichas/mike3.jpg" target="_blank" class="char-link"><img src="images/mike3.jpg" class="char-img"></a><span class="char-name">MIKE</span></div>
            <div class="char-box"><a href="fichas/will3.jpg" target="_blank" class="char-link"><img src="images/will3.jpg" class="char-img"></a><span class="char-name">WILL</span></div>
            <div class="char-box"><a href="fichas/dustin3.jpg" target="_blank" class="char-link"><img src="images/dustin3.jpg" class="char-img"></a><span class="char-name">DUSTIN</span></div>
            <div class="char-box"><a href="fichas/lucas3.jpg" target="_blank" class="char-link"><img src="images/lucas3.jpg" class="char-img"></a><span class="char-name">LUCAS</span></div>
            <div class="char-box"><a href="fichas/max3.jpg" target="_blank" class="char-link"><img src="images/max3.jpg" class="char-img"></a><span class="char-name">MAX</span></div>
            <div class="char-box"><a href="fichas/erica3.jpg" target="_blank" class="char-link"><img src="images/erica3.jpg" class="char-img"></a><span class="char-name">ERICA</span></div>
            <div class="char-box"><a href="fichas/jonathan3.jpg" target="_blank" class="char-link"><img src="images/jonathan3.jpg" class="char-img"></a><span class="char-name">JONATHAN</span></div>
            <div class="char-box"><a href="fichas/nancy3.jpg" target="_blank" class="char-link"><img src="images/nancy3.jpg" class="char-img"></a><span class="char-name">NANCY</span></div>
            <div class="char-box"><a href="fichas/steve3.jpg" target="_blank" class="char-link"><img src="images/steve3.jpg" class="char-img"></a><span class="char-name">STEVE</span></div>
            <div class="char-box"><a href="fichas/robin3.jpg" target="_blank" class="char-link"><img src="images/robin3.jpg" class="char-img"></a><span class="char-name">ROBIN</span></div>
            <div class="char-box"><a href="fichas/hopper3.jpg" target="_blank" class="char-link"><img src="images/hopper3.jpg" class="char-img"></a><span class="char-name">HOPPER</span></div>
            <div class="char-box"><a href="fichas/joyce3.jpg" target="_blank" class="char-link"><img src="images/joyce3.jpg" class="char-img"></a><span class="char-name">JOYCE</span></div>




        </aside>

        <main style="display: flex; flex-direction: column;">
		<img id="scene-img" src="images/360.gif" class="scene-frame">
            <div class="narrative-text">
                <div id="text-content">




                    El Starcourt es ahora un campo de batalla. El Azotamentes ruge en el atrio mientras bajo tierra se decide el destino del portal. El final ha comenzado.




                </div>
                <div id="options-container">
                    <button class="btn" style="text-align:center" onclick="renderStep()">COMENZAR CAPÍTULO</button>
                </div>
                <div id="final-card" class="card-display"></div>
            </div>
        </main>

        <aside class="side-panel">
            <label style="font-size: 1rem; color: var(--vecna-red); text-align: center;">DADOS</label>
            <div class="dice-grid">
                <button class="dice-btn" onclick="roll(4)">d4</button>
                <button class="dice-btn" onclick="roll(6)">d6</button>
                <button class="dice-btn" onclick="roll(8)">d8</button>
                <button class="dice-btn" onclick="roll(10)">d10</button>
                <button class="dice-btn" onclick="roll(12)">d12</button>
                <button class="dice-btn" onclick="roll(20)">d20</button>
            </div>
            <div class="result-window" id="result">--</div>
            <div id="explode-msg">¡EXPLOTA!</div>
            <div style="margin-top: auto;">





           <div style="margin-top: auto;">
                <button class="btn" id="ctrl-voice" onclick="toggleVoice(event)">🎙️ VOZ: <span id="status-voice">ON</span></button>
                <button class="btn" id="ctrl-music" onclick="toggleMusic(event)">📻 MÚSICA: <span id="status-music">ON</span></button>
            </div>


                <button class="btn" style="border-color: #555; text-align: center;" onclick="goBack()">🏠 MENÚ</button>
            </div>
        </aside>
    </div>

    <script>
        let step = 0;
        let successes = 0;
        let failures = 0;
        let voiceEnabled = true;
        let musicEnabled = true;
        let started = false;

        const trama = [
//        img: "images/361.gif",
// *********************************************************** ACTOS ************************************************************************************
            {
                text: "ACTO 1: El atrio central. Billy tiene a Once acorralada bajo el mando del Azotamentes. Los niños lanzan fuegos artificiales para ganar tiempo.",
        img: "images/361.gif",
participantes: ["once3.jpg", "mike3.jpg", "will3.jpg", "lucas3.jpg", "max3.jpg", "steve3.jpg"],
                options: [
                    { label: "Once: Conectar con los recuerdos de Billy", attr: "Agallas", dif: 9 },
                    { label: "Distraer a la bestia", attr: "Encanto", dif: 9 }
                ],
                win: "Once toca la cara de Billy y le habla de su madre y California. Una lágrima rompe el control del monstruo.",
                lose: "Once no logra conectar. Billy la levanta por el cuello, listo para entregarla a la masa de carne. (+1 Adversidad)"
            },
            {
                text: "ACTO 2: Pelea en la turbina. Bajo tierra, Hopper se enfrenta a Grigori. El ruso es una máquina de matar y el tiempo se agota.",
        img: "images/362.jpg",
participantes: ["hopper3.jpg", "joyce3.jpg"],
                options: [
                    { label: "Lanzar a Grigori a los engranajes", attr: "Músculo", dif: 9 },
                    { label: "Desarmar al ruso", attr: "Pelea", dif: 9 }
                ],
                win: "Hopper lanza a Grigori a la turbina. El ruso es desintegrado por la energía. Hopper queda atrapado en la zona de fuego.",
                lose: "Grigori hiere a Hopper. Joyce mira impotente mientras el portal sigue brillando con fuerza. (+1 Adversidad)"
            },
            {
                text: "ACTO 3: Redención. El Azotamentes ruge y se lanza sobre Once, pero alguien se interpone en su camino.",
        img: "images/363.gif",
participantes: ["once3.jpg", "mike3.jpg", "will3.jpg", "lucas3.jpg", "max3.jpg", "steve3.jpg"],
                options: [
                    { label: "Once: convencer a Billy a luchar contra el monstruo", attr: "Agallas", dif: 16 },
                    { label: "Golpear a la bestia", attr: "Músculo", dif: 16 }
                ],
                win: "¡Billy se sacrifica! Aguanta el ataque el tiempo suficiente para proteger a su hermana y a Once. Pero el monstruo acaba con él.",
                lose: "El monstruo lanza a Billy contra los escombros. El grupo queda expuesto. (+1 Adversidad)"
            },
            {
                text: "ACTO 4: Las Llaves del destino. Joyce debe girar las dos llaves para cerrar el portal, pero la máquina está fallando.",
        img: "images/364.gif",
participantes: ["hopper3.jpg", "joyce3.jpg"],
                options: [
                    { label: "Joyce: Girar las llaves con Hopper dentro", attr: "Agallas", dif: 9 },
                    { label: "Reparar el mecanismo atascado", attr: "Cerebro", dif: 9 }
                ],
                win: "¡El portal se cierra! La explosión vaporiza la sala. Joyce sobrevive, pero Hopper ha desaparecido en la luz.",
                lose: "Las llaves se rompen. Hopper ha desaparecido en la luz. La energía residual azota la base. (+1 Adversidad)"
            },
            {
                text: "ACTO 5: La caída del monstruo. Sin la energía del portal, la masa de carne en el atrio empieza a colapsar sobre sí misma.",
        img: "images/365.gif",
participantes: ["once3.jpg", "mike3.jpg", "will3.jpg", "lucas3.jpg", "max3.jpg", "steve3.jpg"],
                options: [
                    { label: "Sacar a Billy de entre los restos", attr: "Músculo", dif: 9 },
                    { label: "Evacuar a los heridos del centro comercial", attr: "Evasión", dif: 9 }
                ],
                win: "Lográis salir antes de que el techo se colapse. Billy muere como un héroe redimido en brazos de Max.",
                lose: "El techo cae. Billy queda sepultado y varios niños resultan heridos por escombros. (+1 Adversidad)"
            },
            {
                text: "ACTO 6: El adiós. El ejército llega al Starcourt. Hawkins parece a salvo, pero el grupo ha quedado tocado para siempre.",
        img: "images/366.webp",
participantes: ["once3.jpg", "mike3.jpg", "will3.jpg", "lucas3.jpg", "max3.jpg", "steve3.jpg"],
                options: [
                    { label: "Once: Buscar a Hopper en el Vacío", attr: "Agallas", dif: 9 },
                    { label: "Consolar a Max por la pérdida de Billy", attr: "Encanto", dif: 9 }
                ],
                win: "Once no encuentra a Hopper, ha perdido sus poderes. Pero siente un eco de esperanza. La mudanza de los Byers comienza.",
                lose: "El silencio es absoluto. Once ha perdido sus poderes por completo. (+1 Adversidad)"
            }

// **********************************************************************************************************************************************
        ];

function comenzarTodo() {
    document.getElementById('splash-screen').style.display = 'none';
    started = true;
    document.getElementById('audioMusic').play().catch(() => {}); 
    speak(document.getElementById('text-content').innerText); 
}

function renderStep() {
    if(step >= trama.length) { showEnding(); return; }
    const data = trama[step];

    // --- LÓGICA DEL TELÉFONO (NUEVO) ---
    // El Acto 6 es la posición 5 (porque empezamos a contar desde 0)
    if (step === 0) { 
        const tlf = document.getElementById('audioDemogorgon');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 1) { 
        const tlf = document.getElementById('audioGun');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 2) { 
        const tlf = document.getElementById('audioDemogorgon');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 3) { 
        const tlf = document.getElementById('audioReactor');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    if (step === 4) { 
        const tlf = document.getElementById('audioDemogorgon');
        if (tlf) tlf.play().catch(() => {}); 
    }
    // ----------------------------------
    
    document.getElementById('scene-img').src = data.img;
    document.getElementById('text-content').innerText = data.text;

    // Actualizar Banner dinámico
    const banner = document.getElementById('banner-personajes');
    if (banner) {
        banner.innerHTML = ""; 
        if (data.participantes) {
            data.participantes.forEach(foto => {
                const nombreBase = foto.split('.')[0].replace(/[0-9]/g, ''); 
                const numTemp = foto.replace(/[^0-9]/g, ''); 
                banner.innerHTML += `
                    <div class="char-box">
                        <a href="fichas/${nombreBase}${numTemp}.jpg" target="_blank" class="char-link">
                            <img src="images/${foto}" class="char-img">
                        </a>
                        <span class="char-name">${nombreBase.toUpperCase()}</span>
                    </div>`;
            });
        }
    }

    const container = document.getElementById('options-container');
    container.innerHTML = "";
    data.options.forEach(o => {
        const b = document.createElement('button');
        b.className = "btn";
        b.innerHTML = `${o.label} <span style="color:var(--gold)">(${o.attr} Dif. ${o.dif})</span>`;
        b.onclick = () => askCheck(o.attr, o.dif);
        container.appendChild(b);
    });
    speak(data.text);
}

function askCheck(attr, dif) {
    const container = document.getElementById('options-container');
    container.innerHTML = `
        <div style="text-align:center; padding: 10px; border: 1px dashed var(--vecna-red); background: rgba(20,0,0,0.5);">
            <p>Tirada de: <strong>${attr}</strong> | Dificultad: <strong>${dif}</strong></p>
        </div>
        <div class="check-ui">
            <button class="btn btn-ok" onclick="resolve(true)">ÉXITO</button>
            <button class="btn btn-fail" onclick="resolve(false)">FALLO</button>
        </div>`;
}

function resolve(win) {
    const data = trama[step];
    if(win) successes++; else failures++;
    document.getElementById('text-content').innerHTML = `<span style="color:${win?'#00ff00':'var(--vecna-red)'}">${win ? data.win : data.lose}</span>`;
    
    // BOTÓN QUE ARREGLA EL ERROR:
    document.getElementById('options-container').innerHTML = `
        <button class="btn" style="text-align:center" onclick="avanzarActo()">
            ${step === (trama.length - 1) ? 'VER EPÍLOGO' : 'SIGUIENTE ACTO'}
        </button>`;
    speak(win ? data.win : data.lose);
}

function avanzarActo() {
    step++;
    renderStep();
}







// ******************************************* FINALES **************************************************************************

function showEnding() {
    const card = document.getElementById('final-card');
    const sceneImg = document.getElementById('scene-img'); // Referencia a la imagen
    card.style.display = "block";
    let title = "", desc = "";
    
    // Condición 1: Final Bueno (4 o más éxitos)
    if(successes >= 5) {
        sceneImg.src = "images/366b.gif"; 
        title = "FINAL BUENO: EL SACRIFICIO DEL HÉROE";
        desc = "Billy se redimió y el portal se cerró. Tres meses después, Once lee la carta de Hopper: 'Mantén la puerta abierta diez centímetros'. Aún hay esperanza. Ganáis una recompensa. [Código Temporada 4: 4444]";
    } 
    // Condición 2: Final Normal (Exactamente 3 éxitos y 3 fallos)
    else if(successes === 3 || successes === 4) {
        sceneImg.src = "images/366b.gif";
        title = "FINAL NORMAL: LA BRECHA RESIDUAL";
        desc = "El portal se cerró, pero Billy murió sin perdón y una grieta sigue palpitando bajo el centro comercial. La amenaza no se ha ido, solo espera. Tres meses después, Once lee la carta de Hopper: 'Mantén la puerta abierta diez centímetros'. Aún hay esperanza. [Código Temporada 4: 4444]";
    } 
    // Condición 3: Final Malo (Menos de 3 éxitos)
    else {
        sceneImg.src = "images/gameover.gif";
        title = "FINAL MALO: EL VERANO QUE NUNCA TERMINÓ";
        desc = "El portal sigue abierto. Hawkins es zona de cuarentena y el Azotamentes camina por las calles. Debéis repetir del capítulo.";
    }

    document.getElementById('text-content').innerHTML = `<strong>${title}</strong><br>Éxitos: ${successes} | Fallos: ${failures}`;
    card.innerText = desc;
    
    // Lógica de botones
    let canProgress = (successes >= 4) || (successes === 3 && failures === 3);
    if(canProgress) {
        document.getElementById('options-container').innerHTML = `
            <button class="btn" style="text-align:center; border-color:var(--gold); color:var(--gold);" onclick="window.location.href='menu.html'">⏭️ VOLVER AL MENÚ PRINCIPAL</button>
        `;
    } else {
        document.getElementById('options-container').innerHTML = `
            <button class="btn" style="text-align:center; border-color:var(--vecna-red);" onclick="location.reload()">🔄 REINTENTAR CAPÍTULO</button>
        `;
    }
    speak(title + ". " + desc);
}

// **********************************************************************************************************************************************

        function roll(sides) {
            const sfx = document.getElementById('audioDice'); sfx.currentTime = 0; sfx.play();
            const res = Math.floor(Math.random() * sides) + 1;
            document.getElementById('result').innerText = res;
            document.getElementById('explode-msg').style.visibility = (res === sides) ? "visible" : "hidden";
        }

        function toggleMusic(e) { 
            e.stopPropagation(); musicEnabled = !musicEnabled; 
            const m = document.getElementById('audioMusic'); 
            musicEnabled ? m.play() : m.pause(); 
            document.getElementById('status-music').innerText = musicEnabled ? "ON" : "OFF"; 
        }

        function toggleVoice(e) { 
            e.stopPropagation(); voiceEnabled = !voiceEnabled; 
            document.getElementById('status-voice').innerText = voiceEnabled ? "ON" : "OFF"; 
            if(!voiceEnabled) window.speechSynthesis.cancel(); 
        }

        function speak(t) { 
            if(!voiceEnabled) return; 
            window.speechSynthesis.cancel(); 
            const m = new SpeechSynthesisUtterance(t); 
            m.lang = 'es-ES'; m.rate = 1.0;
            window.speechSynthesis.speak(m); 
        }



        function goBack() { if(confirm("¿Volver al menú?")) window.location.href = "menu.html"; }

/* ************************************** SONIDO CLICK ************************************** */
function playClick() {
    const clickSfx = document.getElementById('audioClick');
    if (clickSfx) {
        clickSfx.currentTime = 0; // Reinicia el sonido para que suene en cada clic rápido
        clickSfx.play().catch(() => {}); // El catch evita errores si el navegador bloquea el audio
    }
}
document.addEventListener('click', playClick);

    </script>
</body>
</html>
